<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Productos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            margin-bottom: 20px;
        }

        form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        input,
        select {
            padding: 8px;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table th,
        table td {
            border: 1px solid #ddd;
            padding: 10px;
        }

        table th {
            background: #f5f5f5;
        }

        .acciones {
            display: flex;
            gap: 5px;
        }

        .btn-editar {
            background: #ffc107;
            border: none;
        }

        .btn-eliminar {
            background: #dc3545;
            color: white;
            border: none;
        }

        .btn-guardar {
            background: #198754;
            color: white;
            border: none;
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <h1>Gestión de Productos</h1>

    <form id="formProducto">

        <input type="hidden" id="id_producto">

        <div class="campo">
            <label>Descripción</label>
            <input
            type="text"
            id="descripcion"
            required
        >
        </div>

        <div class="campo">
            <label>Prenda</label>
            <select id="id_prenda" required>
            <option value="">Seleccione</option>
        </select>
        </div>

        <div class="campo">
            <label>Estilo</label>
            <select id="id_estilo" required>
            <option value="">Seleccione</option>
        </select>
        </div>

        <div class="campo">
            <label>Molde</label>
            <input
            type="number"
            id="id_molde"
        >
        </div>

        <div class="campo">
            <label>Tela</label>
            <input
            type="number"
            id="id_tela"
            required
        >
        </div>

        <div class="campo">
            <label>Cliente</label>
            <input
            type="number"
            id="id_cliente"
            required
        >
        </div>

        <div class="campo">
            <label>Estado</label>
            <input
            type="number"
            id="id_estado"
            value="1"
        >
        </div>

        <div class="campo">
            <label>Talla</label>
            <select id="id_talla">
            <option value="">Seleccione</option>
        </select>
        </div>

        <button
        type="submit"
        class="btn-guardar"
    >
        Guardar Producto
    </button>

    </form>

    <hr>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Descripción</th>
                <th>Prenda</th>
                <th>Estilo</th>
                <th>Tela</th>
                <th>Cliente</th>
                <th>Estado</th>
                <th>Talla</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody id="tablaProductos">

        </tbody>

    </table>

    <script src="/static/js/productos.js"></script>

</body>

</html>
