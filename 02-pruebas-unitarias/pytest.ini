[pytest]
# Configuración de pytest para Pruebas Unitarias - JAANSTYLE

# Directorio de tests
testpaths = src/test/python

# Patrones de descubrimiento de tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opciones de salida
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Markers (etiquetas para tests)
markers =
    unit: Pruebas unitarias
    auth: Pruebas del módulo autenticación
    slow: Pruebas que toman >1 segundo
    integration: Pruebas de integración

# Timeout para tests (en segundos)
timeout = 30

# Configuración de cobertura
[coverage:run]
source = ../../../Tienda-de-ropa/controllers

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
